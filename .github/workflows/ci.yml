name: ImmigrationOS Workspace CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate default Docker Compose topology
        run: docker compose config --quiet
      - name: Validate isolated scanner topology
        run: docker compose --profile scanner config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q app alembic scripts
      - name: Validate consultant and client JavaScript syntax
        run: |
          node --check app/static/workspace.js
          node --check app/static/crm.js
          node --check app/static/engagement.js
          node --check app/static/staff.js
          node --check app/static/application_package.js
          node --check app/static/client.js

  postgres-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8
        env:
          POSTGRES_DB: immigrationos_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev_only_postgres_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d immigrationos_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://immigrationos_migrator:dev_only_migrator@localhost:5432/immigrationos_dev
      RLS_APP_DATABASE_URL: postgresql+psycopg://immigrationos_app:dev_only_app@localhost:5432/immigrationos_dev
      AUTH_ISSUER: https://issuer.example.invalid/realm
      AUTH_AUDIENCE: immigrationos-api
      AUTH_JWKS_URL: https://issuer.example.invalid/jwks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - name: Provision isolated development database roles
        run: |
          python - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect('postgresql://postgres:dev_only_postgres_admin@localhost:5432/immigrationos_dev', autocommit=True) as db:
              db.execute(Path('infra/postgres/01_roles.sql').read_text())
          PY
      - run: alembic upgrade head
      - run: python scripts/verify_rls.py
      - run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_api_smoke.py
      - name: Exercise email-bound portal grants with PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_portal_smoke.py
      - name: Exercise IRCC preflight acknowledgements under PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_form_preflight_smoke.py
      - name: Exercise client questionnaire intake and staff review under PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_study_intake_smoke.py
      - name: Exercise repeatable client records and staff review under PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_repeatable_intake_smoke.py
      - name: Exercise prospect consultation CRM and unsigned-agreement gating under PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_crm_smoke.py
      - name: Exercise signed RCIC service engagement and matter assignment under PostgreSQL RLS
        run: MIGRATION_DATABASE_URL="$DATABASE_URL" DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_engagement_smoke.py
      - name: Exercise verified staff invites and role revocation under PostgreSQL RLS
        run: DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_staff_smoke.py
      - name: Exercise study-permit application packages and form-copy integrity under PostgreSQL RLS
        run: MIGRATION_DATABASE_URL="$DATABASE_URL" DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_package_smoke.py
      - name: Exercise immutable IMM5476 review checkpoints under PostgreSQL RLS
        run: MIGRATION_DATABASE_URL="$DATABASE_URL" DATABASE_URL="$RLS_APP_DATABASE_URL" python scripts/postgres_imm5476_packet_smoke.py

  official-imm5476-readonly-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+pysqlite:///./research-observation.db
      AUTH_ISSUER: https://issuer.example.invalid/realm
      AUTH_AUDIENCE: immigrationos-api
      AUTH_JWKS_URL: https://issuer.example.invalid/jwks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - name: Download official blank document and inspect XFA (research only)
        continue-on-error: true
        run: python -m scripts.observe_imm5476_template --output reports/imm5476-observation.json
      - name: Print public structural inspection result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/imm5476-observation.json')
          if p.exists():
              print(json.dumps(json.loads(p.read_text()), indent=2, sort_keys=True))
          else:
              print('No observation file generated.')
          PY
      - name: Archive public blank PDF observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm5476-readonly-probe
          path: reports/imm5476-observation.json
          retention-days: 14
