name: Compare real IMM5476 XDP engines (evaluation only)
on:
  pull_request:
    paths:
      - ".github/workflows/imm5476-xdp-engine-trial.yml"
      - "scripts/imm5476_xdp_vendor_trial.py"
      - "experiments/QoppaImm5476Trial.java"
      - "experiments/TallImm5476Trial/**"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  vendor-sdk-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fetch Qoppa public trial jar without downloading official form
        run: |
          curl -fL --retry 2 --connect-timeout 15 --max-time 60 \
            "https://www.qoppa.com/files/pdffields/jars/v2022R1/jPDFFields.v2022R1.20.jar" \
            -o qoppa-trial.jar
          jar tf qoppa-trial.jar | grep -q 'com/qoppa/pdfFields/PDFFields.class'
      - name: Compile Qoppa importer
        run: javac -cp qoppa-trial.jar experiments/QoppaImm5476Trial.java
      - name: Short-lived internal SDK handoff for offline official-template validation
        uses: actions/upload-artifact@v4
        with:
          name: qoppa-private-evaluation-sdk
          path: qoppa-trial.jar
          retention-days: 1
      - name: Compile TallComponents vendor API
        run: dotnet build experiments/TallImm5476Trial/TallImm5476Trial.csproj -c Release

  prepare-official:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only official document verifier
        run: python -m pip install 'pypdf>=6,<7'
      - name: Download official IRCC blank and enforce SHA-256
        run: |
          mkdir -p vendor-fixtures
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from hashlib import sha256
          import time
          url=("https://www.canada.ca/content/dam/ircc/documents/pdf/english/"
               "kits/forms/imm5476/01-11-2025/imm5476e.pdf")
          expected="aca5c476b93d1c496b1afbc2cfe843499e852e31dcf0c192153bd01f8d6c56c4"
          for attempt in range(1,5):
              try:
                  request=Request(url, headers={"User-Agent":"Mozilla/5.0",
                               "Accept":"application/pdf"})
                  with urlopen(request,timeout=30) as response:
                      original=response.read(12*1024*1024+1)
                  assert original.startswith(b"%PDF-")
                  assert sha256(original).hexdigest() == expected, "Template changed"
                  Path("vendor-fixtures/official-imm5476.pdf").write_bytes(original)
                  print("Pinned official source verified, bytes",len(original))
                  break
              except (OSError, TimeoutError) as exc:
                  print("Government source access attempt",attempt,type(exc).__name__)
                  if attempt == 4:
                      raise
                  time.sleep(attempt)
          PY
      - name: Generate two independent four-field fictional XDP datasets
        run: python -m scripts.imm5476_xdp_vendor_trial prepare vendor-fixtures/official-imm5476.pdf vendor-fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: imm5476-public-test-fixtures
          path: vendor-fixtures/
          retention-days: 1

  qoppa-java:
    needs: prepare-official
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: imm5476-public-test-fixtures
          path: vendor-fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf>=6,<7'
      - name: Download official Qoppa jPDFFields evaluation JAR
        run: |
          mkdir -p trial-qoppa
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 75 \
            "https://www.qoppa.com/files/pdffields/jars/v2022R1/jPDFFields.v2022R1.20.jar" \
            --output trial-qoppa/jpdffields-eval.jar
          jar tf trial-qoppa/jpdffields-eval.jar | grep -q 'com/qoppa/pdfFields/PDFFields.class'
      - name: Compile authentic-form Qoppa XDP importer
        run: javac -cp trial-qoppa/jpdffields-eval.jar -d trial-qoppa experiments/QoppaImm5476Trial.java
      - name: Import fictional XDP through Qoppa evaluation SDK
        run: |
          for variant in scalar rich; do
            java -cp "trial-qoppa:trial-qoppa/jpdffields-eval.jar" QoppaImm5476Trial \
              vendor-fixtures/official-imm5476.pdf \
              vendor-fixtures/fictional-$variant.xdp \
              trial-qoppa/qoppa-$variant-UNVALIDATED.pdf \
              >trial-qoppa/qoppa-$variant.log 2>&1 || true
            cat trial-qoppa/qoppa-$variant.log
            if test -f trial-qoppa/qoppa-$variant-UNVALIDATED.pdf; then
              python -m scripts.imm5476_xdp_vendor_trial verify \
                vendor-fixtures/official-imm5476.pdf \
                trial-qoppa/qoppa-$variant-UNVALIDATED.pdf \
                trial-qoppa/qoppa-$variant-report.json || true
            fi
          done
          if ! grep -l '"status": "both_layers_pass"' trial-qoppa/*-report.json 2>/dev/null; then
            echo "Qoppa did not pass two-layer validation on either XDP variant"
            exit 2
          fi
      - name: Archive Qoppa evaluation output, never SDK jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm5476-qoppa-evaluation
          path: |
            trial-qoppa/*.pdf
            trial-qoppa/*.json
            trial-qoppa/*.log
          retention-days: 7
          if-no-files-found: warn

  tall-dotnet:
    needs: prepare-official
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: imm5476-public-test-fixtures
          path: vendor-fixtures
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install comparison readback dependencies
        run: python -m pip install 'pypdf>=6,<7'
      - name: Build TallComponents evaluation adapter
        run: dotnet build experiments/TallImm5476Trial/TallImm5476Trial.csproj -c Release
      - name: Import fictional XDP using TallComponents
        run: |
          mkdir -p trial-tall
          for variant in scalar rich; do
            dotnet run --no-build --configuration Release \
              --project experiments/TallImm5476Trial/TallImm5476Trial.csproj -- \
              vendor-fixtures/official-imm5476.pdf \
              vendor-fixtures/fictional-$variant.xdp \
              trial-tall/tall-$variant-UNVALIDATED.pdf \
              >trial-tall/tall-$variant.log 2>&1 || true
            cat trial-tall/tall-$variant.log
            if test -f trial-tall/tall-$variant-UNVALIDATED.pdf; then
              python -m scripts.imm5476_xdp_vendor_trial verify \
                vendor-fixtures/official-imm5476.pdf \
                trial-tall/tall-$variant-UNVALIDATED.pdf \
                trial-tall/tall-$variant-report.json || true
            fi
          done
          if ! grep -l '"status": "both_layers_pass"' trial-tall/*-report.json 2>/dev/null; then
            echo "TallComponents did not pass two-layer validation on either XDP variant"
            exit 2
          fi
      - name: Archive TallComponents evaluation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm5476-tall-evaluation
          path: |
            trial-tall/*.pdf
            trial-tall/*.json
            trial-tall/*.log
          retention-days: 7
          if-no-files-found: warn
