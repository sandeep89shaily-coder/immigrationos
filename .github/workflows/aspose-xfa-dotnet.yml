name: Native Aspose .NET XFA compatibility proof (experimental)
on:
  pull_request:
    paths:
      - "experiments/AsposeXfaTrial/**"
      - ".github/workflows/aspose-xfa-dotnet.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dotnet-xfa:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official Aspose.PDF .NET trial package
        run: dotnet restore experiments/AsposeXfaTrial/AsposeXfaTrial.csproj
      - name: Build native C# XFA writer
        run: dotnet build --no-restore experiments/AsposeXfaTrial/AsposeXfaTrial.csproj -c Release
      - name: Fetch exact official IMM5476 government PDF and verify SHA-256
        run: |
          mkdir -p trial-out
          python - <<'PY'
          from urllib.request import Request, urlopen
          import hashlib
          import os
          from pathlib import Path
          url=("https://www.canada.ca/content/dam/ircc/documents/pdf/english/"
               "kits/forms/imm5476/01-11-2025/imm5476e.pdf")
          expected="aca5c476b93d1c496b1afbc2cfe843499e852e31dcf0c192153bd01f8d6c56c4"
          import time
          from urllib.error import HTTPError
          raw=None
          for attempt in range(1,5):
              try:
                  req=Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0","Accept":"application/pdf"})
                  with urlopen(req,timeout=45) as response:
                      candidate=response.read(12*1024*1024+1)
                  digest=hashlib.sha256(candidate).hexdigest()
                  if not candidate.startswith(b"%PDF-") or digest != expected:
                      raise SystemExit("Official blank changed or is not PDF; refusing alternate bytes")
                  raw=candidate
                  break
              except (OSError, TimeoutError) as exc:
                  print("Official source attempt",attempt,"error",type(exc).__name__)
                  if attempt < 4:
                      time.sleep(attempt * 2)
          if raw is None:
              raise SystemExit("Official blank download repeatedly unavailable; no XFA run")
          print("official_pdf_bytes",len(raw),"exact_sha256_match",True)
          (Path(os.environ["RUNNER_TEMP"]) / "imm5476-blank.pdf").write_bytes(raw)
          PY
      - name: Native .NET XFA field population, fictional data only
        run: |
          dotnet run --no-build --project experiments/AsposeXfaTrial/AsposeXfaTrial.csproj \
            --configuration Release -- \
            "$RUNNER_TEMP/imm5476-blank.pdf" \
            "trial-out/IMM5476-ASPOSE-NATIVE-FICTIONAL-UNVALIDATED.pdf" \
            "trial-out/aspose-dotnet-report.json"
      - name: Independent XFA datasets readback
        run: |
          python -m pip install 'pypdf>=6,<7'
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import xml.etree.ElementTree as ET
          path=Path("trial-out/IMM5476-ASPOSE-NATIVE-FICTIONAL-UNVALIDATED.pdf")
          reader=PdfReader(path,strict=True)
          assert len(reader.pages)==4
          fields=reader.get_fields() or {}
          expected={
              "IMM_5476[0].Page1[0].SectionA[0].familyName[0]":"Sharma",
              "IMM_5476[0].Page1[0].SectionA[0].givenName[0]":"Aarav",
              "IMM_5476[0].Page1[0].SectionB[0].familyName[0]":"Kapoor",
              "IMM_5476[0].Page1[0].SectionB[0].givenName[0]":"Anita",
          }
          checked={key:str(fields.get(key,{}).get("/V",""))==value
                   for key,value in expected.items()}
          print("AcroForm field verification:",checked)
          if not all(checked.values()):
              raise SystemExit("Native .NET PDF did not preserve expected form values")
          original=Path(__import__("os").environ["RUNNER_TEMP"])/"imm5476-blank.pdf"
          if not path.read_bytes().startswith(original.read_bytes()):
              raise SystemExit("Incremental result changed signed original PDF bytes")
          print("Original signed byte prefix preserved")
          PY
      - name: Archive fictional evaluation output and technical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm5476-aspose-dotnet-trial
          path: trial-out/
          retention-days: 7
