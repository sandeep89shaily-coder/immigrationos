name: Native Aspose .NET XFA compatibility proof (experimental)
on:
  pull_request:
    paths:
      - "experiments/AsposeXfaTrial/**"
      - ".github/workflows/aspose-xfa-dotnet.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dotnet-xfa:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore official Aspose.PDF .NET trial package
        run: dotnet restore experiments/AsposeXfaTrial/AsposeXfaTrial.csproj
      - name: Build native C# XFA writer
        run: dotnet build --no-restore experiments/AsposeXfaTrial/AsposeXfaTrial.csproj -c Release
      - name: Fetch exact official IMM5476 government PDF and verify SHA-256
        run: |
          mkdir -p trial-out
          python - <<'PY'
          from urllib.request import Request, urlopen
          import hashlib
          import os
          from pathlib import Path
          url=("https://www.canada.ca/content/dam/ircc/documents/pdf/english/"
               "kits/forms/imm5476/01-11-2025/imm5476e.pdf")
          expected="aca5c476b93d1c496b1afbc2cfe843499e852e31dcf0c192153bd01f8d6c56c4"
          req=Request(url,headers={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0","Accept":"application/pdf"})
          with urlopen(req,timeout=25) as response:
              raw=response.read(12*1024*1024+1)
          digest=hashlib.sha256(raw).hexdigest()
          print("official_pdf_bytes",len(raw),"exact_sha256_match",digest==expected)
          if not raw.startswith(b"%PDF-") or digest != expected:
              raise SystemExit("Wrong or unavailable official blank: refusing to generate PDF")
          (Path(os.environ["RUNNER_TEMP"]) / "imm5476-blank.pdf").write_bytes(raw)
          PY
      - name: Native .NET XFA field population, fictional data only
        run: |
          dotnet run --no-build --project experiments/AsposeXfaTrial/AsposeXfaTrial.csproj \
            --configuration Release -- \
            "$RUNNER_TEMP/imm5476-blank.pdf" \
            "trial-out/IMM5476-ASPOSE-NATIVE-FICTIONAL-UNVALIDATED.pdf" \
            "trial-out/aspose-dotnet-report.json"
      - name: Independent XFA datasets readback
        run: |
          python -m pip install 'pypdf>=6,<7'
          python - <<'PY'
          from pathlib import Path
          from scripts.evaluate_aspose_xfa import inspect_output
          path=Path("trial-out/IMM5476-ASPOSE-NATIVE-FICTIONAL-UNVALIDATED.pdf")
          result=inspect_output(path, {
              "applicant_family":"Sharma", "applicant_given":"Aarav",
              "representative_family":"Kapoor","representative_given":"Anita"})
          print(result)
          if not result.get("all_xfa_values_match"):
              raise SystemExit("Native .NET PDF has not passed XFA data readback")
          PY
      - name: Archive fictional evaluation output and technical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imm5476-aspose-dotnet-trial
          path: trial-out/
          retention-days: 7
