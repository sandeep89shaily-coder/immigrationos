# DEVELOPMENT ONLY; never expose outside localhost or use production client data.
services:
  db:
    image: postgres:16.8
    environment:
      POSTGRES_DB: immigrationos_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_only_postgres_admin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_dev:/var/lib/postgresql/data
      - ./infra/postgres/01_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immigrationos_dev"]
      interval: 4s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: devadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: dev_only_admin_password
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
  clamav:
    image: clamav/clamav:stable
    profiles: [scanner]
    networks: [scan_internal]
    volumes:
      - clamav_signatures:/var/lib/clamav
    # Clamd's TCP socket is unauthenticated: intentionally NOT published to the host.
    # Requires ~3-4 GB RAM; cold startup/signature updates may take several minutes.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://immigrationos_migrator:dev_only_migrator@db:5432/immigrationos_dev
      AUTH_ISSUER: http://localhost:8080/realms/immigrationos-dev
      AUTH_AUDIENCE: immigrationos-api
      AUTH_JWKS_URL: http://keycloak:8080/realms/immigrationos-dev/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://immigrationos_app:dev_only_app@db:5432/immigrationos_dev
      AUTH_ISSUER: http://localhost:8080/realms/immigrationos-dev
      AUTH_AUDIENCE: immigrationos-api
      AUTH_JWKS_URL: http://keycloak:8080/realms/immigrationos-dev/protocol/openid-connect/certs
      CORS_ORIGINS: http://localhost:3000
      UPLOADS_ENABLED: "true"
      # External AI is opt-in and only for fictional data in development.
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-false}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      EXPERIMENTAL_AI_ENABLED: ${EXPERIMENTAL_AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      DOCUMENT_STORAGE_ROOT: /app/data/documents
      # DEV ONLY shared test key; never deploy with this value or real client files.
      DOCUMENT_ENCRYPTION_KEY: "l8OE70c8L4TkD6t6iIDy-V1_EKq_aWpGunc_XfdGZeU="
    networks: [default, scan_internal]
    volumes:
      - doc_dev:/app/data
    depends_on:
      clamav:
    image: clamav/clamav:stable
    profiles: [scanner]
    networks: [scan_internal]
    volumes:
      - clamav_signatures:/var/lib/clamav
    # Clamd's TCP socket is unauthenticated: intentionally NOT published to the host.
    # Requires ~3-4 GB RAM; cold startup/signature updates may take several minutes.
  migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
networks:
  scan_internal:
    internal: true
volumes:
  pg_dev:
  doc_dev:
  clamav_signatures:
