[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "immigrationos-workspace"
version = "0.3.0"
description = "Tenant-isolated Canadian immigration case and evidence workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.8,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "cryptography>=44,<47"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "reportlab>=4,<5"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.ruff]
line-length = 100
